name: Smoke test bundled runtimes

# Boots each per-OS bundled runtime on its matching runner and launches the game
# headlessly, confirming it starts and stays up. Also verifies the executable bits
# on the Unix runtime binaries survive a fresh checkout.

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    paths:
      - 'runtime/**'
      - 'bin/**'
      - 'RunMe.*'
      - '.github/smoke.sh'
      - '.github/workflows/smoke-test.yml'

jobs:
  smoke:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64,   java: runtime/windows-x64/bin/java.exe }
          - { os: ubuntu-latest,  label: linux-x64,     java: runtime/linux-x64/bin/java }
          - { os: macos-latest,   label: macos-aarch64, java: runtime/macos-aarch64/bin/java }
    steps:
      - uses: actions/checkout@v4

      - name: Install Xvfb (Linux virtual display)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Smoke test ${{ matrix.label }}
        shell: bash
        run: bash .github/smoke.sh "${{ matrix.java }}" "${{ matrix.label }}"

      # The Apple Silicon runner also exercises the Intel (x64) runtime through
      # Rosetta 2 (preinstalled on GitHub macOS runners). Non-fatal: GitHub's
      # native Intel runners are deprecated, so this is best-effort coverage.
      - name: Smoke test macos-x64 via Rosetta
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: bash .github/smoke.sh "runtime/macos-x64/bin/java" "macos-x64-rosetta"
